<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldLightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ca8a04" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Black Circle Background -->
  <circle cx="256" cy="256" r="236" fill="url(#darkBg)"/>

  <!-- Golden Yellow Outer Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldLightning)" stroke-width="24" filter="url(#lightningGlow)"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#ca8a04" stroke-width="2" opacity="0.6"/>

  <!-- Dynamic Sharp Lightning Bolt cutting diagonally -->
  <polygon points="
    318,72
    188,252
    258,252
    174,440
    336,224
    264,224
  " fill="url(#goldLightning)" stroke="#ca8a04" stroke-width="4" stroke-linejoin="round" filter="url(#lightningGlow)"/>
</svg>