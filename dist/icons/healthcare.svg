<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>
    <radialGradient id="redGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="xShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Red Background Disc -->
    <circle cx="256" cy="256" r="236" fill="url(#redGradient)"/>

    <!-- Black X extending across the entire medallion -->
    <!-- Diagonal 1: top-left to bottom-right -->
    <polygon points="40,94 94,40 472,418 418,472" fill="#09090b" filter="url(#xShadow)"/>
    <!-- Diagonal 2: top-right to bottom-left -->
    <polygon points="418,40 472,94 94,472 40,418" fill="#09090b" filter="url(#xShadow)"/>
    <!-- Center reinforcement -->
    <circle cx="256" cy="256" r="32" fill="#09090b"/>

    <!-- Yellow Rim Arcs (The 4 segments framed by the X) -->
    <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGradient)" stroke-width="24"/>
    <circle cx="256" cy="256" r="206" fill="none" stroke="#713f12" stroke-width="2.5" opacity="0.5"/>

    <!-- Gold Accent Edge on the X arms -->
    <line x1="84" y1="52" x2="460" y2="428" stroke="#ca8a04" stroke-width="2" opacity="0.6"/>
    <line x1="428" y1="52" x2="52" y2="428" stroke="#ca8a04" stroke-width="2" opacity="0.6"/>
  </g>
</svg>